name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tropa_ci?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret
  JWT_REFRESH_SECRET: ci-refresh-secret
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 30d
  CORS_ORIGIN: http://localhost:3000
  MP_ACCESS_TOKEN: "test_ci"
  MP_PUBLIC_KEY: "test_ci"
  MP_WEBHOOK_SECRET: "test_ci"
  MERCADOPAGO_ACCESS_TOKEN: "test_ci"
  CF_ACCOUNT_ID: ""
  CF_STREAM_TOKEN_ID: ""
  CF_STREAM_TOKEN_VALUE: ""

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tropa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @tropa/api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @tropa/api exec prisma migrate deploy

      - name: Seed DB (fixtures para e2e)
        run: |
          pnpm --filter @tropa/api db:seed:build
          pnpm --filter @tropa/api db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm --filter @tropa/api exec jest --runInBand --passWithNoTests

      - name: E2E tests
        run: pnpm --filter @tropa/api exec jest --config ./test/jest-e2e.json --runInBand

      - name: Build
        run: pnpm build