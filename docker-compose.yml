services:
  postgres:
    image: postgres:16-alpine
    container_name: tropa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tropa
      POSTGRES_PASSWORD: tropa
      POSTGRES_DB: tropa
    ports:
      - "5432:5432"
    volumes:
      - tropa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tropa -d tropa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tropa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tropa_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tropa_pg:
  tropa_redis: